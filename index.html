<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Configuración de Rifas</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0d140f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: rgba(13, 20, 15, 0.98);
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 2px #d4af37;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #d4af37;
            font-family: 'Impact', Arial, sans-serif;
            letter-spacing: 1px;
            margin-top: 0;
        }
        .seccion {
            border-bottom: 1px solid #444;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .seccion-titulo {
            font-size: 14px;
            color: #d4af37;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .campo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #cdcdcd;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"], input[type="date"], textarea, select {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #0a0e0b;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: 1px solid #444;
            border-radius: 6px;
            background: none;
            cursor: pointer;
            box-sizing: border-box;
            padding: 2px;
        }
        .color-grupo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        button {
            width: 100%;
            background-color: #d4af37;
            color: #000;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #f3ca52;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Configuración General de la Rifa</h2>
    <form id="formConfig">
        
        <div class="seccion">
            <div class="seccion-titulo">Identidad del Sorteo</div>
            <div class="campo">
                <label>Título de la Rifa</label>
                <input type="text" id="tituloRifa" required placeholder="Ej: GRAN RIFA PRO-FONDOS">
            </div>
            <div class="campo">
                <label>Descripción Corta / Instrucciones</label>
                <textarea id="descripcionRifa" required placeholder="Ej: SEPARA TU NÚMERO Y APOYA NUESTRA CAUSA"></textarea>
            </div>
        </div>

        <div class="seccion">
            <div class="seccion-titulo">Parámetros del Sorteo</div>
            <div class="campo">
                <label>Organizador / Encargado</label>
                <input type="text" id="encargado" required>
            </div>
            <div class="campo">
                <label>Fecha del Sorteo</label>
                <input type="date" id="fechaSorteo" required>
            </div>
            <div class="campo">
                <label>Valor del Boleto ($)</label>
                <input type="number" id="valorRifa" required>
            </div>
            <div class="campo">
                <label>Medio de Pago Principal</label>
                <input type="text" id="medioPago" required placeholder="Ej: Nequi 3123456789">
            </div>
            <div class="campo">
                <label>WhatsApp de Contacto Oficial</label>
                <input type="text" id="whatsapp" required placeholder="Ej: +57 312 345 6789">
            </div>
        </div>

        <div class="seccion">
            <div class="seccion-titulo">Reglas de Automatización</div>
            <div class="campo">
                <label>¿Permitir una única participación por persona?</label>
                <select id="unicaParticipacion">
                    <option value="NO">NO (Un usuario puede comprar varios números)</option>
                    <option value="SI">SI (Restringir a 1 boleta por Nombre/Teléfono)</option>
                </select>
            </div>
            <div class="campo">
                <label>Días previos Alerta 1</label>
                <input type="number" id="alerta1" value="0">
            </div>
            <div class="campo">
                <label>Días previos Alerta 2</label>
                <input type="number" id="alerta2" value="0">
            </div>
            <div class="campo">
                <label>Días previos Alerta 3</label>
                <input type="number" id="alerta3" value="0">
            </div>
        </div>

        <div class="seccion">
            <div class="seccion-titulo">Estilos de la Interfaz (GitHub)</div>
            <div class="color-grupo">
                <div class="campo">
                    <label>Fondo del Tablero</label>
                    <input type="color" id="fondoFormulario" value="#0d140f">
                </div>
                <div class="campo">
                    <label>Color de Textos</label>
                    <input type="color" id="colorFuentes" value="#ffffff">
                </div>
            </div>
        </div>

        <button type="submit" id="btnGuardar">Guardar Configuración</button>
    </form>
</div>

<script>
    // URL DE TU WEB APP DE GOOGLE
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzdfV4SiVyiJo_jcq-O2qaaos4XQq_mAPnf6BPU6h8ITSXE3fQl83FQxXZ7SNl1YRiY/exec";

    // Cargar la configuración actual al iniciar el panel configurador externo
    window.addEventListener('DOMContentLoaded', () => {
        fetch(`${WEB_APP_URL}?accion=obtener_config`)
        .then(res => res.json())
        .then(data => {
            if(data.error) return;
            document.getElementById('tituloRifa').value = data.titulo || '';
            document.getElementById('descripcionRifa').value = data.descripcion || '';
            document.getElementById('encargado').value = data.encargado || '';
            document.getElementById('fechaSorteo').value = data.fecha || '';
            document.getElementById('valorRifa').value = data.valor || '';
            document.getElementById('medioPago').value = data.medio || '';
            document.getElementById('whatsapp').value = data.whatsapp || '';
            document.getElementById('unicaParticipacion').value = data.unico || 'NO';
            document.getElementById('alerta1').value = data.u2 || 0;
            document.getElementById('alerta2').value = data.w2 || 0;
            document.getElementById('alerta3').value = data.y2 || 0;
            
            // Cargar los colores salvados mapeados desde la hoja
            document.getElementById('fondoFormulario').value = data.fondoFormulario || '#0d140f';
            document.getElementById('colorFuentes').value = data.colorFuentes || '#ffffff';
        })
        .catch(err => console.error("Error cargando configuración inicial:", err));
    });

    document.getElementById('formConfig').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnGuardar');
        const textoOriginal = btn.innerText;
        btn.innerText = 'Guardando cambios...';
        btn.disabled = true;

        const datos = {
            action: "actualizarConfiguracion",
            encargado: document.getElementById('encargado').value,
            fechaSorteo: document.getElementById('fechaSorteo').value,
            valorRifa: document.getElementById('valorRifa').value,
            medioPago: document.getElementById('medioPago').value,
            whatsapp: document.getElementById('whatsapp').value,
            alerta1: document.getElementById('alerta1').value,
            alerta2: document.getElementById('alerta2').value,
            alerta3: document.getElementById('alerta3').value,
            unicaParticipacion: document.getElementById('unicaParticipacion').value,
            tituloRifa: document.getElementById('tituloRifa').value,
            descripcionRifa: document.getElementById('descripcionRifa').value,
            fondoFormulario: document.getElementById('fondoFormulario').value,
            colorFuentes: document.getElementById('colorFuentes').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        })
        .then(() => {
            alert('¡Configuración enviada con éxito!\nLos datos se están aplicando en tu Google Sheet.');
            btn.innerText = textoOriginal;
            btn.disabled = false;
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Hubo un problema al conectar con el servidor.');
            btn.innerText = textoOriginal;
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
